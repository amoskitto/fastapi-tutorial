name: Build and Deploy Code

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: testing
    
    env:
      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: 5433
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: fastapi_test
      DATABASE_USERNAME: postgres
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: fastapi_test
        ports:
          - 5433:5432
    
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4
      
      - name: install python version 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: update pip
        run: python -m pip install --upgrade pip
      
      - name: install all dependencies
        run: pip install -r requirements.txt
      
      - name: Wait for PostgreSQL to be ready
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..15}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/15)"
            sleep 2
          done
          echo "PostgreSQL never became ready"
          exit 1
      
      - name: Override .env port for tests  # ✅ ADD THIS
        run: |
          sed -i 's/DATABASE_PORT=.*/DATABASE_PORT=5433/' .env
          echo "DATABASE_PORT=5433" >> .env
      
      - name: test with pytest
        run: |
          pip install pytest
          pytest tests/ -v --disable-warnings

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: amosogonna/fastapi-tutorial  # Replace with your username
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

  deploy:
  runs-on: ubuntu-latest
  needs: [build]

  steps:
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/fastapi-key.pem
        chmod 600 ~/.ssh/fastapi-key.pem

    - name: Deploy to AWS
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/fastapi-key.pem ubuntu@${{ secrets.SERVER_IP }} "
          docker pull amosogonna/fastapi-tutorial:latest
          docker stop fastapi-app || true
          docker rm fastapi-app || true
          docker run -d --name fastapi-app -p 8000:8000 \
            -e DATABASE_HOSTNAME=${{ secrets.DATABASE_HOSTNAME }} \
            -e DATABASE_PORT=${{ secrets.DATABASE_PORT }} \
            -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
            -e DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
            -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
            -e ALGORITHM=${{ secrets.ALGORITHM }} \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }} \
            amosogonna/fastapi-tutorial:latest
        "