name: Build and Deploy Code

on: [push, pull_request]

jobs:
  job1:
    runs-on: ubuntu-latest
    environment: testing
    
    env:
      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: fastapi_test
      DATABASE_USERNAME: postgres
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: fastapi_test
        ports:
          - 5433:5432
    
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4
      
      - name: install python version 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: update pip
        run: python -m pip install --upgrade pip
      
      - name: install all dependencies
        run: pip install -r requirements.txt
      
      - name: Debug PostgreSQL container
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== PostgreSQL logs ==="
          docker logs $(docker ps -aq --filter "ancestor=postgres:15") 2>/dev/null || echo "No container found"
      
      - name: Wait for PostgreSQL to be ready
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/15)"
            sleep 2
          done
          echo "PostgreSQL never became ready"
          exit 1
      
      - name: test with pytest
        run: |
          pip install pytest
          pytest tests/ -v --disable-warnings